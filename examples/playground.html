<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>heatmapUI — playground</title>
<link rel="stylesheet" href="../src/styles.css" />
<style>
  :root { color-scheme: light dark; --bg:#faf9f7; --panel:#fff; --line:#e6e1d9; --ink:#1a1815; --muted:#7d766d; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0e0d; --panel:#171614; --line:#2a2724; --ink:#e8e6e3; --muted:#9a938a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  .shell { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
  @media (max-width:900px){ .shell{grid-template-columns:1fr} }
  .panel { padding:20px; border-right:1px solid var(--line); background:var(--panel); overflow-y:auto; max-height:100vh; }
  .panel h1 { margin:0 0 2px; font-size:15px; }
  .panel .sub { margin:0 0 18px; color:var(--muted); font-size:12px; }
  .group { margin-bottom:18px; }
  .group > h2 { margin:0 0 8px; font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; }
  .row label { font-size:13px; cursor:pointer; }
  .row output { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }
  input[type=range]{width:118px;accent-color:var(--accent)}
  input[type=color]{width:30px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  select{width:150px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px}
  .seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px}
  .seg button{flex:1;padding:4px 6px;border:0;border-radius:5px;background:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
  .seg button[data-on=true]{background:var(--accent);color:#fff}
  .stage{display:flex;flex-direction:column;gap:22px;padding:26px;min-width:0}
  .card{padding:20px;border:1px dashed var(--line);border-radius:12px;overflow-x:auto}
  .card h3{margin:0 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .card p{margin:0 0 14px;color:var(--muted);font-size:12px}
  pre{margin:0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow-x:auto;font:12px/1.65 ui-monospace,Menlo,monospace;white-space:pre}
  .shapes{display:flex;flex-wrap:wrap;gap:18px}
  .shapes figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .shapes figcaption{color:var(--muted);font-size:11px}
  .boot{padding:26px;color:var(--muted)}
</style>
<script type="importmap">
{"imports":{
  "react":"https://esm.sh/react@19.2.0",
  "react/jsx-runtime":"https://esm.sh/react@19.2.0/jsx-runtime",
  "react-dom":"https://esm.sh/react-dom@19.2.0",
  "react-dom/client":"https://esm.sh/react-dom@19.2.0/client"
}}
</script>
</head>
<body>
<div id="root"><div class="boot">Loading… (React is fetched from a CDN)</div></div>
<script type="module">
import React, { useState, useMemo } from "react";
import { createRoot } from "react-dom/client";
import { Heatmap, CalendarHeatmap } from "../dist/index.js";

const h = React.createElement;
const SHAPES = ["rounded","square","circle","diamond","hexagon","plus","bar","ring"];
const RAMPS = {
  green:  ["#9be9a8","#40c463","#30a14e","#216e39"],
  blue:   ["#bfd4f7","#7ea6f0","#3f74e0","#1b4bb8"],
  violet: ["#ddd0f7","#b79bec","#8b5cf6","#5b2fc4"],
  amber:  ["#fde8b8","#f8cd6b","#eda52b","#b9740a"],
  mono:   ["#d9d5cf","#a8a29a","#6f6a62","#33302c"],
};

const DEFAULTS = {
  shape:"rounded", encode:"color", scale:"quantile",
  cellSize:13, gap:3, levels:4, weeks:20,
  ramp:"green", empty:"#ebedf0", showLegend:true, showWeekdays:false, theme:"system",
};

/** Deterministic sample so the page looks the same on every load. */
function noise(i, salt){ let v=Math.imul(i+salt*0x9e37,0x85ebca6b)^(salt*0xc2b2ae35); v=Math.imul(v^(v>>>13),0xc2b2ae35); v^=v>>>16; return (v>>>0)/0x100000000; }

function calendarDays(weeks){
  const out=[]; const end=new Date(Date.UTC(2026,8,7));
  for(let i=weeks*7-1;i>=0;i--){
    const d=new Date(end.getTime()-i*86400000);
    const wd=d.getUTCDay(); const dip=(wd===0||wd===6)?0.45:1;
    const roll=noise(i,1);
    // A deliberate gap, so the "no data" treatment is visible.
    if(i>=40&&i<=52) { out.push({date:d.toISOString().slice(0,10),value:0,known:false}); continue; }
    out.push({date:d.toISOString().slice(0,10),value: roll<0.22?0:Math.round(noise(i,2)*180*dip)});
  }
  return out;
}
const punchcard = Array.from({length:24},(_,hour)=>Array.from({length:7},(_,day)=>{
  const work = hour>8&&hour<19 && day>0&&day<6 ? 1 : 0.15;
  return Math.round(noise(hour*7+day,3)*100*work);
}));

function Row({label,htmlFor,children}){ return h("div",{className:"row"},h("label",{htmlFor},label),children); }
function Slider({s,set,name,label,min,max,suffix=""}){ const id="c-"+name;
  return h(Row,{label,htmlFor:id},h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
    h("input",{id,type:"range",min,max,value:s[name],onChange:e=>set(name,Number(e.target.value))}),
    h("output",null,s[name]+suffix)));}
function Toggle({s,set,name,label}){ const id="c-"+name;
  return h(Row,{label,htmlFor:id},h("input",{id,type:"checkbox",checked:s[name],onChange:e=>set(name,e.target.checked)}));}
function Select({s,set,name,label,options}){ const id="c-"+name;
  return h(Row,{label,htmlFor:id},h("select",{id,value:s[name],onChange:e=>set(name,e.target.value)},
    options.map(o=>h("option",{key:o,value:o},o))));}
function Seg({value,options,onChange}){ return h("div",{className:"seg"},options.map(o=>
  h("button",{key:o,type:"button","data-on":value===o?"true":"false",onClick:()=>onChange(o)},o)));}

function snippet(s){
  const p=[];
  if(s.shape!=="rounded")p.push(`  shape="${s.shape}"`);
  if(s.encode!=="color")p.push(`  encode="${s.encode}"`);
  if(s.scale!=="quantile")p.push(`  scale="${s.scale}"`);
  if(s.cellSize!==13)p.push(`  cellSize={${s.cellSize}}`);
  if(s.gap!==3)p.push(`  gap={${s.gap}}`);
  if(s.levels!==4)p.push(`  levels={${s.levels}}`);
  if(s.ramp!=="green")p.push(`  colors={${JSON.stringify(RAMPS[s.ramp])}}`);
  if(s.showLegend)p.push("  showLegend");
  if(s.showWeekdays)p.push("  showWeekdayLabels");
  return `<CalendarHeatmap\n  values={days}\n  weeks={${s.weeks}}\n${p.join("\n")}${p.length?"\n":""}/>`;
}

function App(){
  const [s,setS]=useState(DEFAULTS);
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  const days=useMemo(()=>calendarDays(s.weeks),[s.weeks]);
  const colors=RAMPS[s.ramp];
  const common={shape:s.shape,encode:s.encode,scale:s.scale,cellSize:s.cellSize,gap:s.gap,levels:s.levels,colors,emptyColor:s.empty};
  const themeAttr=s.theme==="system"?undefined:s.theme;

  return h("div",{className:"shell"},
    h("aside",{className:"panel"},
      h("h1",null,"heatmapUI"),
      h("p",{className:"sub"},"Any grid. Honest gaps. Quantile shading."),
      h("div",{className:"group"},h("h2",null,"Theme"),
        h(Seg,{value:s.theme,options:["system","light","dark"],onChange:v=>set("theme",v)})),
      h("div",{className:"group"},h("h2",null,"Cells"),
        h(Select,{s,set,name:"shape",label:"Shape",options:SHAPES}),
        h(Select,{s,set,name:"encode",label:"Encode",options:["color","size","both"]}),
        h(Slider,{s,set,name:"cellSize",label:"Size",min:6,max:30,suffix:"px"}),
        h(Slider,{s,set,name:"gap",label:"Gap",min:0,max:10,suffix:"px"})),
      h("div",{className:"group"},h("h2",null,"Scale"),
        h(Select,{s,set,name:"scale",label:"Scale",options:["quantile","linear","log"]}),
        h(Slider,{s,set,name:"levels",label:"Levels",min:2,max:8}),
        h(Slider,{s,set,name:"weeks",label:"Weeks",min:4,max:53})),
      h("div",{className:"group"},h("h2",null,"Colour"),
        h(Select,{s,set,name:"ramp",label:"Ramp",options:Object.keys(RAMPS)}),
        h(Row,{label:"Empty",htmlFor:"c-empty"},
          h("input",{id:"c-empty",type:"color",value:s.empty,onChange:e=>set("empty",e.target.value)}))),
      h("div",{className:"group"},h("h2",null,"Labels"),
        h(Toggle,{s,set,name:"showLegend",label:"Legend"}),
        h(Toggle,{s,set,name:"showWeekdays",label:"Weekday labels"}))),

    h("main",{className:"stage"},
      h("section",{className:"card"},
        h("h3",null,"Calendar"),
        h("p",null,"The adapter. Note the pale band — that is a gap in the data, drawn differently from a zero."),
        h(CalendarHeatmap,{values:days,weeks:s.weeks,unitLabel:"events",showLegend:s.showLegend,
          showWeekdayLabels:s.showWeekdays,"data-heatmap-theme":themeAttr,
          tooltip:c=>c.known?`${c.date}: ${c.value} events`:`${c.date}: no data`,...common})),

      h("section",{className:"card"},
        h("h3",null,"Punchcard — 24 × 7"),
        h("p",null,"The same core with no dates involved: hours down, weekdays across."),
        h(Heatmap,{rows:24,columns:7,values:punchcard,ariaLabel:"Commits by hour and weekday",
          rowLabels:Array.from({length:24},(_,i)=>i%6===0?`${i}:00`:""),
          columnLabels:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((t,i)=>({column:i,text:t})),
          cellLabel:c=>`${c.row}:00 on day ${c.column}: ${c.value}`,
          tooltip:c=>`${String(c.row).padStart(2,"0")}:00 — ${c.value}`,
          "data-heatmap-theme":themeAttr,...common})),

      h("section",{className:"card"},
        h("h3",null,"Every shape"),
        h("p",null,"Same data, same scale."),
        h("div",{className:"shapes"},SHAPES.map(shape=>
          h("figure",{key:shape},
            h(Heatmap,{rows:7,columns:10,values:days.slice(-70).map((d,i)=>({row:i%7,column:Math.floor(i/7),value:d.value,known:d.known!==false})),
              ...common,shape,cellSize:14,"data-heatmap-theme":themeAttr}),
            h("figcaption",null,shape))))),

      h("pre",null,snippet(s))));
}
createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
