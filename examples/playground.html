            "    `${services[cell.row]}: ${cell.known ? `${statusOf(cell.value).label}, ${cell.value}% up` : \"not monitored\"}`}",
            "  tooltip={(cell) =>",
            "    cell.known ? `${services[cell.row]} — ${statusOf(cell.value).label}, ${cell.value}% up` : `${services[cell.row]} — not monitored`}",
          ] : [
            "  cellLabel={(cell) => `${services[cell.row]}: ${cell.known ? cell.value + \"% up\" : \"not monitored\"}`}",
            "  tooltip={(cell) =>",
            "    cell.known ? `${services[cell.row]} — ${cell.value}% up` : `${services[cell.row]} — not monitored`}",
          ]),
        ],
      };
    },
  },
};
const GRAPH_NAMES = Object.keys(GRAPHS);
const CHART_KEYS=["graph",...new Set(GRAPH_NAMES.flatMap(g=>GRAPHS[g].dataKeys))];

/** Entrance props: the index drives an even 100ms cadence between groups. */
const enter=(i,extra)=>({className:"enter",style:{"--enter-index":i,...extra}});

/**
 * Everything the preview and the Code tab are derived from, as one pure
 * function of the settings. Keeping it outside App lets a test render both
 * sides and check that the code shown is the chart shown.
 */
function buildChart(s,{isDark,days=calendarDays(s.weeks),onCameraChange}={}){
  const is3d=s.dimension==="3d";
  const themeAttr=s.theme==="system"?undefined:s.theme;
  // A derived ramp is tied to the surface behind it and to the level count, so
  // it stays legible on either ground and never runs short of bands.
  const ground=isDark?GROUND_DARK:GROUND_LIGHT;
  const colors=paletteFor(s.ramp,{dark:isDark,base:s.base,levels:s.levels});
  // Until the colour is chosen explicitly, the empty cell follows the theme —
  // a light grey on a dark ground reads as data, not as absence.
  const empty=s.empty??(isDark?EMPTY_DARK:EMPTY_LIGHT);

  // Width and height replace the square size wherever the preset splits them.
  const common={scale:s.scale,cellSize:usesCellAxes(s)?undefined:s.cellSize,
    gap:s.gap,levels:s.levels,showLegend:s.showLegend,
    ...(is3d?{shape:s.shape3d,blockStyle:s.blockStyle,maxHeight:s.maxHeight,
      theme:s.theme3d,material:s.material,animation:s.animation,
      // Only `color` hands its bands over; the rest would be overruled by a
      // ramp they never asked for, so the palette is withheld from them.
      ...(themed3d(s)?{}:{colors,emptyColor:empty}),
      yaw:s.yaw,pitch:s.pitch,zoom:s.zoom/100,onCameraChange}
      :{colors,emptyColor:empty,shape:s.shape,encode:s.encode,
        ...(s.showValues?{cellContent:c=>c.known&&c.value>0?c.value:null}: {})})};

  const graph=GRAPHS[s.graph];
  const stride=(usesCellAxes(s)?s.cellWidth:s.cellSize)+s.gap;
  const ctx={s,common,themeAttr,days,stride,isDark,empty};
  const code=snippet(s,empty,ground,colors,stride);
  const flatView=graph.view(ctx);
  const chart=is3d?h(s.graph==="calendar"?CalendarHeatmap3D:Heatmap3D,flatView.props):flatView;
  return {graph,is3d,ground,colors,empty,stride,code,chart};
}

function App(){
  const [s,setS]=useState(DEFAULTS);
  const [panelView,setPanelView]=useState("preview");
  const [tray,setTray]=useState(null);
  const [openSections,setOpenSections]=useState(
    {chart:true,cells:true,colour:true,labels:true});
  const themeScopeRef=useRef(null);
  const activeThemeTransition=useRef(null);
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  const toggleSection=key=>setOpenSections(p=>({...p,[key]:!p[key]}));
  /* Resetting one section is the common case — an experiment with colour
   * should not cost the shape and the labels you already settled on. */
  const resetKeys=keys=>setS(p=>{
    const next={...p};
    keys.forEach(k=>{next[k]=DEFAULTS[k];});
    return next;
  });
  const is3d=s.dimension==="3d";
  const setCamera=c=>setS(p=>({...p,yaw:c.yaw,pitch:c.pitch,zoom:c.zoom*100}));
  const resetCamera=()=>setS(p=>({...p,yaw:-35,pitch:38,zoom:100}));
  const days=useMemo(()=>calendarDays(s.weeks),[s.weeks]);
  const systemDark=useSystemDark();
  const themeAttr=s.theme==="system"?undefined:s.theme;
  const isDark=themeAttr?themeAttr==="dark":systemDark;

  const {graph,empty,code,chart}=
    buildChart(s,{isDark,days,onCameraChange:setCamera});

  // The theme choice has to reach the page chrome, not just the components.
  useEffect(()=>{
    const el=document.documentElement;
    if(themeAttr) el.setAttribute("data-theme",themeAttr); else el.removeAttribute("data-theme");
  },[themeAttr]);
  useEffect(()=>{ if(!themeAttr) suppressTransitions(); },[systemDark,themeAttr]);

  const changeTheme=(theme,{animate=false}={})=>{
    const switchTheme=()=>set("theme",theme);
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const scope=themeScopeRef.current;
    const start=scope?.startViewTransition;
    if(!animate||reduced||!scope||typeof start!=="function"){
      suppressTransitions();
      switchTheme();
      return;
    }
    const active=activeThemeTransition.current;
    if(active){
      active.skipTransition?.();
      activeThemeTransition.current=null;
      suppressTransitions();
      switchTheme();
      return;
    }
    try {
      const transition=start.call(scope,switchTheme);
      activeThemeTransition.current=transition;
      void transition.finished.catch(()=>{}).finally(()=>{
        if(activeThemeTransition.current===transition) activeThemeTransition.current=null;
      });
    } catch {
      suppressTransitions();
      switchTheme();
    }
  };


  /* --- The strip -----------------------------------------------------------
   * The compact, frequently checked controls stay above the preview. Palette,
   * scale, and bands live in the rail so they are always one click away.
   */
  const dataControls=graph.data(s,set);
  const differs=(...keys)=>keys.some(k=>s[k]!==DEFAULTS[k]);
  const modified={
    cells: differs(...cellKeysFor(s)),
    // A withheld palette is not a change worth flagging, so under a named
    // theme the badge counts the theme alone.
    colour: (is3d&&differs("theme3d"))||(!themed3d(s)&&differs("ramp","base","empty"))||
      (usesCellAxes(s)&&differs(...STATUS_KEYS)),
    scale: differs("scale","levels"),
    labels: differs("showLegend",...(is3d?[]:["showValues"]),...graph.labelKeys),
    camera: differs("yaw","pitch","zoom"),
  };
  const sections=[
    ...(is3d?[{key:"camera",name:"Camera"}]:[]),
  ];
  const cellKeys=cellKeysFor(s);
  const colourKeys=["ramp","base","empty","scale","levels",...(is3d?["theme3d"]:[]),...STATUS_KEYS];
  const labelKeys=["showLegend",...(is3d?[]:["showValues"]),...graph.labelKeys];
  // Leaving 3D closes a tray that no longer has anything to show.
  const openTray=sections.some(x=>x.key===tray)?tray:null;
  // The tally sits beside Reset, so it counts every configurable rail area and
  // each remaining pill that Reset undoes.
  const chartChanged=differs("graph",...graph.dataKeys);
  const changed=(modified.cells?1:0)+(modified.colour?1:0)+(modified.scale?1:0)+(modified.labels?1:0)+sections.filter(x=>modified[x.key]).length+(chartChanged?1:0);

  const cameraPreset=CAMERA_PRESETS.find(preset=>
    Math.abs(s.yaw-preset.yaw)<1&&Math.abs(s.pitch-preset.pitch)<1&&Math.abs(s.zoom-100)<1);
  const pillValue={
    camera: cameraPreset?cameraPreset.label:"Custom",
  };

  const trayColumns=()=>{
    if(openTray==="camera") return [
      h(TrayColumn,{key:"preset",title:"Preset",width:"250px"},
        h("div",{className:"camera-presets",role:"group","aria-label":"Camera presets"},
          CAMERA_PRESETS.map(preset=>h("button",{key:preset.label,type:"button",className:"camera-preset",
            "aria-pressed":Math.abs(s.yaw-preset.yaw)<1&&Math.abs(s.pitch-preset.pitch)<1,
            onClick:()=>setS(prev=>({...prev,yaw:preset.yaw,pitch:preset.pitch,zoom:100}))},preset.label)))),
      h(TrayColumn,{key:"angle",title:"Angle",width:"236px"},
        h(Slider,{s,set,name:"yaw",label:"Rotation",min:-180,max:180,suffix:"°"}),
        h(Slider,{s,set,name:"pitch",label:"Tilt",min:15,max:75,suffix:"°"}),
        h(Slider,{s,set,name:"zoom",label:"Zoom",min:55,max:200,suffix:"%"})),
      h(TrayColumn,{key:"note",title:"Note",grow:true},
        h("p",{className:"field-note"},
          "Dragging the chart moves these directly, and the readout under the preview follows.")),
    ];

    return [];
  };

  return h("div",{className:"playground-root"},
    h("div",{className:"theme-transition-scope",ref:themeScopeRef},
      h("div",{className:"shell"},
        h("aside",{className:"sidebar"},

          /* The header holds what the whole panel is about: the product, the
           * theme, and which of the two renderers everything below applies to.
           * The theme switcher used to float over the rail on a hard-coded
           * offset; here it simply belongs to a row. */
          h("div",{...enter(0),className:"panel-head enter"},
            h("div",{className:"panel-head-top"},
              h("div",{className:"brand"},
                h("div",{className:"brand-mark"},h(BrandMark)),
                h("div",{className:"brand-copy"},
                  h("div",{className:"brand-name"},"heatmap-ui"),
                  h("span",{className:"brand-version"},"v0.2.0"))),
              h(Tabs,{value:s.theme,label:"Theme",compact:true,
                onChange:(v,meta)=>changeTheme(v,meta),options:[
                  {value:"system",label:"System",icon:"monitor"},
                  {value:"light",label:"Light",icon:"sun"},
                  {value:"dark",label:"Dark",icon:"moon"}]})),
            h(DimensionSwitch,{value:s.dimension,onChange:v=>set("dimension",v)})),

          h("div",{className:"panel-body"},
            h(Section,{...enter(1),id:"sec-chart",title:"Chart",
              open:openSections.chart,onToggle:()=>toggleSection("chart"),
              modified:chartChanged,onReset:()=>resetKeys(CHART_KEYS)},
              h(Select,{s,set,name:"graph",label:"Type",options:GRAPH_NAMES,
                format:k=>GRAPHS[k].label,optionPreview:graph=>h(ChartPreview,{graph})}),
              ...dataControls,
              dataControls.length===0?h("p",{className:"field-note"},
                "Fixed at 24 × 7 — hours down, weekdays across. Nothing to set."):null),

            h(Section,{...enter(2),id:"sec-cells",title:"Cells",
              open:openSections.cells,onToggle:()=>toggleSection("cells"),
              modified:modified.cells,onReset:()=>resetKeys(cellKeys)},
              h(CellControls,{s,set,is3d})),

            h(Section,{...enter(3),id:"sec-colour",title:"Colour",
              open:openSections.colour,onToggle:()=>toggleSection("colour"),
              modified:modified.colour||modified.scale,onReset:()=>resetKeys(colourKeys)},
              h(ColourControls,{s,set,setS,is3d,isDark,empty})),

            h(Section,{...enter(4),id:"sec-labels",title:"Labels",
              open:openSections.labels,onToggle:()=>toggleSection("labels"),
              modified:modified.labels,onReset:()=>resetKeys(labelKeys)},
              h(LabelControls,{s,set,is3d,graph}))),

          h("div",{className:"panel-foot"},
            h("span",{className:"rail-changes"},
              changed>0?h("span",{className:"pill-mark","aria-hidden":"true"}):null,
              changed===0?"Matches defaults":changed===1?"1 area changed":changed+" areas changed"),
            h("button",{type:"button",className:"btn btn-ghost",
              onClick:()=>{setTray(null);setS(p=>({...DEFAULTS,theme:p.theme}));}},
              h(Icon,{name:"reset",size:14,stroke:2}),"Reset all"))),

    h("main",{className:"stage"},
      h("header",enter(0),
        h("div",{className:"page-heading"},
        h("div",null,
            h("h1",{className:"page-title"},"Playground"))),
        h("p",{className:"page-desc"},
          "A headless heatmap for React. Eight cell shapes, a 3D mode, and every colour under your control."),
        h("div",{className:"install"},
          h("code",null,"npm i @thilakbhat/heatmap-ui"),
          h(CopyButton,{text:"npm i @thilakbhat/heatmap-ui",label:"Copy",className:"btn btn-ghost"}))),

      /* Camera is preview-specific, so it remains available beside the chart
       * while dimension, data, cells, colour, scale, and labels live in the rail. */
      sections.length?h("div",{...enter(1),className:"strip enter"},
        sections.map(section=>h(Pill,{key:section.key,name:section.name,
          value:pillValue[section.key],open:openTray===section.key,
          modified:modified[section.key],
          onClick:()=>setTray(current=>current===section.key?null:section.key)}))):null,

      openTray?h(Tray,{label:sections.find(x=>x.key===openTray).name,
        onClose:()=>setTray(null)},trayColumns()):null,

      h("section",{...enter(2),className:"card preview-card enter"+(is3d?" three-card":"")},
        h("div",{className:"preview-tabs",role:"tablist","aria-label":"Chart view"},
          h("button",{id:"chart-preview-tab",type:"button",className:"preview-tab",role:"tab",
            "aria-selected":panelView==="preview","aria-controls":"chart-view-panel",
            onClick:()=>setPanelView("preview")},"Preview"),
          h("button",{id:"chart-code-tab",type:"button",className:"preview-tab",role:"tab",
            "aria-selected":panelView==="code","aria-controls":"chart-view-panel",
            onClick:()=>setPanelView("code")},"Code")),
        h("div",{id:"chart-view-panel",className:"preview-surface",role:"tabpanel",
          "aria-labelledby":panelView==="preview"?"chart-preview-tab":"chart-code-tab"},
          panelView==="preview"
            ? h(React.Fragment,null,
                h("div",{className:"card-head"},
                  h("div",null,
                    is3d?h("div",{className:"three-kicker"},h("i"),"Live 3D preview"):null,
                    h("div",{className:"card-title-line"},
                      h("h2",{className:"card-title"},graph.label+(is3d?" / "+MATERIALS.find(m=>m.value===s.blockStyle).label+" · "+title(s.theme3d):"")),
                      h("span",{className:"badge"},graph.badge(s))),
                    h("p",{className:"card-desc"},is3d?"Drag to orbit. Focus a cell to explore its value.":graph.description)),
                  is3d?h("div",{className:"chart-view-actions"},
                    h("button",{type:"button",className:"btn btn-ghost",onClick:resetCamera},h(Icon,{name:"reset",size:13}),"Reset view")):null),
                h("div",{className:"card-body"},chart),
                is3d?h("div",{className:"chart-status"},
                  h("span",null,h(Icon,{name:"height",size:13}),"Height",h("strong",null,"Value")),
                  h("span",null,"Drag to orbit · + / − to zoom"),
                  h("span",null,h("strong",null,Math.round(s.yaw)+"°")," / ",Math.round(s.pitch)+"°")):null)
            : h("div",{className:"code-panel"},
                h("div",{className:"code-panel-head"},
                  h("div",null,
                    h("h2",{className:"card-title"},"This exact chart, as code"),
                    h("p",{className:"card-desc"},
                      "Every prop above is in effect. Only the data is yours — its shape is in the first comment.")),
                  h(CopyButton,{text:code})),
                h("pre",{className:"code"},code))))))),
  );
}
createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
