<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>heatmap-ui — playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ---------------------------------------------------------------------------
 * shadcn/ui design tokens (neutral base). Real shadcn components need Tailwind
 * and a bundler; this page is served as a static file, so the system is
 * reproduced here by hand — same tokens, same radii, same component anatomy.
 * ------------------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --destructive: oklch(0.577 0.245 27.325);

  /* Hairline over artwork: pure black light, pure white dark. Never tinted. */
  --hairline: oklch(0 0 0 / 0.1);

  /* Depth is a shadow, structure is a border. */
  --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.05);
  --shadow-border:
    0 0 0 1px oklch(0 0 0 / 0.06),
    0 1px 2px -1px oklch(0 0 0 / 0.06),
    0 2px 4px 0 oklch(0 0 0 / 0.04);
  --shadow-border-hover:
    0 0 0 1px oklch(0 0 0 / 0.08),
    0 1px 2px -1px oklch(0 0 0 / 0.08),
    0 2px 4px 0 oklch(0 0 0 / 0.06);

  --radius: 0.625rem;          /* 10px */
  --radius-sm: calc(var(--radius) - 4px);   /* 6px  */
  --radius-md: calc(var(--radius) - 2px);   /* 8px  */
  --radius-lg: var(--radius);               /* 10px */
  --radius-xl: calc(var(--radius) + 4px);   /* 14px */

  /* The properties panel's own rails. One label column, one control height,
   * so every row in every section lines up on the same two edges. */
  --panel-w: 284px;
  --panel-pad: 10px;
  --panel-label: 64px;
  --ctl-h: 28px;

  --focus-ring: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  --ease-emphasis: cubic-bezier(0.2, 0, 0, 1);
  --expo-out: linear(0 0%, .1684 2.66%, .3165 5.49%, .446 8.52%, .5581 11.78%, .6535 15.29%, .7341 19.11%, .8011 23.3%, .8557 27.93%, .8962 32.68%, .9283 38.01%, .9529 44.08%, .9711 51.14%, .9833 59.06%, .9915 68.74%, 1 100%);
}

/* Explicit choice wins in both directions; no attribute means follow the system. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --hairline: oklch(1 0 0 / 0.1);
    --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.3);
    --shadow-border: 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-border-hover: 0 0 0 1px oklch(1 0 0 / 0.13);
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --card-foreground: oklch(0.985 0 0);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --border: oklch(1 0 0 / 10%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.556 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --hairline: oklch(1 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.3);
  --shadow-border: 0 0 0 1px oklch(1 0 0 / 0.08);
  --shadow-border-hover: 0 0 0 1px oklch(1 0 0 / 0.13);
}

/* The theme effect is the reference's circle-blur reveal from the top left.
 * The normal state update remains the fallback for browsers without View
 * Transitions. */
@media (prefers-reduced-motion: no-preference) {
  ::view-transition {
    pointer-events: none;
  }
  ::view-transition-group(root) {
    animation-timing-function: var(--expo-out);
  }
  ::view-transition-new(root) {
    -webkit-mask: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs><circle cx="0" cy="0" r="18" fill="white" filter="url(%23blur)"/></svg>') left top / 0 auto no-repeat;
    mask: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs><circle cx="0" cy="0" r="18" fill="white" filter="url(%23blur)"/></svg>') left top / 0 auto no-repeat;
    -webkit-mask-origin: content-box;
    mask-origin: content-box;
    -webkit-mask-clip: border-box;
    mask-clip: border-box;
    transform-origin: left top;
    animation: theme-transition-scale 400ms ease both;
  }
  ::view-transition-old(root) {
    transform-origin: left top;
    z-index: -1;
    animation: theme-transition-scale 400ms ease both;
  }
  @keyframes theme-transition-scale {
    to {
      -webkit-mask-size: 350vmax auto;
      mask-size: 350vmax auto;
    }
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* The library takes its label and tooltip colours from CSS vars, so the
 * component inherits the design system rather than fighting it. The doubled
 * class matches the specificity of the library's own theme rule
 * (.heatmap:not([data-heatmap-theme="light"])); this sheet loads later, so the
 * tie resolves here. */
.heatmap.heatmap {
  --heatmap-label: var(--muted-foreground);
  --heatmap-tooltip-bg: var(--primary);
  --heatmap-tooltip-text: var(--primary-foreground);
  --heatmap-tooltip-border: transparent;
  --heatmap-tooltip-shadow: 0 10px 30px -10px oklch(0 0 0 / 0.35);
}

/* --- Layout ------------------------------------------------------------- */
.playground-root { position: relative; min-height: 100vh; }
.theme-transition-scope { min-height: 100vh; background: var(--background); color: var(--foreground); }
.shell { display: grid; grid-template-columns: var(--panel-w) minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }

/* --- Properties panel ---------------------------------------------------
 * A Figma-style inspector: a fixed header, one scrolling column of sections,
 * and a footer that never scrolls away. Every row snaps to the same two rails
 * — a label column and a control column — so the eye reads one edge, not six.
 * ---------------------------------------------------------------------- */
.sidebar {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: calc(100vh - 16px);
  margin: 8px;
  border-radius: var(--radius-xl);
  background: var(--card);
  box-shadow: var(--shadow-border);
  position: sticky;
  top: 8px;
  overflow: hidden;                   /* clip the sections to the panel radius */
}

.panel-head {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px var(--panel-pad);
  border-bottom: 1px solid var(--border);
}
.panel-head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.panel-body {
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklch, var(--muted-foreground) 45%, transparent) transparent;
}
.panel-body::-webkit-scrollbar { width: 8px; height: 8px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb {
  background: color-mix(in oklch, var(--muted-foreground) 45%, transparent);
  border: 2px solid transparent;
  border-radius: 9999px;
  background-clip: padding-box;
  transition: background-color 150ms ease-out;
}
.panel-body::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); background-clip: padding-box; }
.panel-body::-webkit-scrollbar-corner { background: transparent; }

.panel-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 7px 7px var(--panel-pad);
  border-top: 1px solid var(--border);
  background: var(--card);
}
.panel-foot .btn { height: 26px; padding-inline: 8px 10px; border-radius: var(--radius-sm); font-size: 11.5px; }

/* --- Section ------------------------------------------------------------ */
.psec { border-bottom: 1px solid color-mix(in oklch, var(--foreground) 7%, transparent); }
.psec:last-child { border-bottom: 0; }
/* The entrance animation leaves each section as its own stacking context.
 * Raise the focused one so its menu can clear the sections below it. */
.psec:focus-within { position: relative; z-index: 40; }
.psec:has(.option-tooltip:hover), .psec:has(.option-tooltip:focus-visible) { position: relative; z-index: 40; }

.psec-head { display: flex; align-items: center; gap: 2px; height: 32px; padding-inline: var(--panel-pad) 6px; }
.psec-toggle {
  display: flex; align-items: center; gap: 5px;
  flex: 1; min-width: 0; height: 26px;
  margin-inline-start: -5px;          /* optical: the caret hangs into the gutter */
  padding-inline: 5px 4px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--foreground);
  font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: -0.005em;
  text-align: start; cursor: pointer;
}
.psec-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.psec-caret {
  display: inline-flex; flex: none;
  color: var(--muted-foreground);
  transition-property: rotate, color;
  transition-duration: 200ms;
  transition-timing-function: var(--ease-emphasis);
}
.psec[data-open="false"] .psec-caret { rotate: -90deg; }
.psec-toggle:hover .psec-caret { color: var(--foreground); }
.psec-dot {
  width: 5px; height: 5px; flex: none;
  border-radius: 9999px;
  background: var(--foreground);
}
.psec-action {
  display: grid; place-items: center;
  width: 24px; height: 24px; flex: none;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted-foreground);
  cursor: pointer; opacity: 0;
  transition-property: opacity, background-color, color, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.psec-head:hover .psec-action, .psec-action:focus-visible { opacity: 1; }
.psec-action:hover { background: var(--accent); color: var(--foreground); }
.psec-action:active { scale: 0.96; }
.psec-action:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.psec-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition-property: grid-template-rows;
  transition-duration: 200ms;
  transition-timing-function: var(--ease-emphasis);
}
.psec[data-open="true"] .psec-panel { grid-template-rows: 1fr; }
/* Clipping is what makes the collapse read as a collapse, but it would also
 * cut off a select menu. The zero-length animation drops the clip only once
 * the section has finished opening, and removing it on close restores it at
 * the first frame of the collapse. */
.psec-clip { overflow: hidden; }
.psec[data-open="true"] .psec-clip { animation: psec-unclip 0s 220ms forwards; }
@keyframes psec-unclip { to { overflow: visible; } }
.psec-rows { display: flex; flex-direction: column; gap: 4px; padding: 0 var(--panel-pad) 10px; }

/* --- Inspector row ------------------------------------------------------ */
.prow {
  display: grid;
  grid-template-columns: var(--panel-label) minmax(0, 1fr);
  align-items: center; gap: 8px;
  min-height: var(--ctl-h);
}
.prow-wide { display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
.prow-label {
  font-size: 11px; font-weight: 500; line-height: 1.2;
  color: var(--muted-foreground);
  user-select: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
label.prow-label { cursor: pointer; }
.prow-ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.prow-ctl > * { min-width: 0; }
.prow-split > * { flex: 1 1 0; }
.prow-end { justify-content: flex-end; }
.prow:has(> .prow-ctl > .switch) { grid-template-columns: minmax(0, 1fr) auto; }
.prow:has(> .prow-ctl > .switch) .prow-label { white-space: normal; }
/* A lone number field keeps the rail rather than stretching across the column. */
.prow-ctl:not(.prow-split) > .nfield { max-width: 96px; }

.panel-body .select-wrap { width: 100%; }
.panel-body .select { height: var(--ctl-h); padding: 0 24px 0 8px; border-radius: var(--radius-sm); font-size: 12px; }
.panel-body .select-chevron { right: 7px; }

/* --- Scrub field --------------------------------------------------------
 * Figma's number input: type an exact value, nudge it with the arrow keys, or
 * drag the grip sideways. A slider can only be dragged, and only as finely as
 * its track is wide — this is smaller on the page and more precise to set.
 * ---------------------------------------------------------------------- */
.nfield {
  display: inline-flex; align-items: center; gap: 1px;
  width: 100%; height: var(--ctl-h);
  padding-inline: 2px 7px;
  border: 1px solid var(--input);
  border-radius: var(--radius-sm);
  background: transparent;
  box-shadow: var(--shadow-xs);
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.nfield:hover { border-color: var(--ring); }
.nfield:focus-within, .nfield[data-scrub="true"] { border-color: var(--ring); box-shadow: var(--focus-ring); }
.nfield-grip {
  display: grid; place-items: center;
  width: 22px; height: 22px; flex: none;
  border-radius: 4px;
  color: var(--muted-foreground);
  cursor: ew-resize;
  touch-action: none;
  transition-property: color, background-color;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.nfield:hover .nfield-grip, .nfield[data-scrub="true"] .nfield-grip { color: var(--foreground); }
.nfield[data-scrub="true"] .nfield-grip { background: var(--accent); }
.nfield-input {
  width: 100%; min-width: 0; height: 100%;
  padding: 0; border: 0;
  background: transparent; color: var(--foreground);
  font: inherit; font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.nfield-input:focus { outline: none; }
.nfield-unit { flex: none; font-size: 11px; color: var(--muted-foreground); user-select: none; }
body[data-scrubbing="true"] { cursor: ew-resize; user-select: none; }

/* --- Tile group ---------------------------------------------------------
 * Sixteen bordered tiles draw sixteen boxes when only one of them matters.
 * The trough carries the structure; the selected tile lifts out of it, the
 * same way the theme tabs already work.
 * ---------------------------------------------------------------------- */
.tilebox {
  display: grid; gap: 3px;
  padding: 3px;                       /* concentric: 8 = 5 + 3 */
  border-radius: var(--radius-md);
  background: color-mix(in oklch, var(--foreground) 6%, transparent);
}
.tilebox-shape { grid-template-columns: repeat(8, minmax(0, 1fr)); }
.tilebox-ramp {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 2px; padding: 4px 5px;
}
.tile {
  display: grid; place-items: center;
  min-width: 0; height: 26px;
  padding: 0; border: 0; border-radius: 5px;
  background: transparent; color: var(--muted-foreground);
  cursor: pointer;
  transition-property: background-color, color, box-shadow, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.tile:hover { background: color-mix(in oklch, var(--foreground) 12%, transparent); color: var(--foreground); }
.tile[aria-pressed="true"] {
  background: var(--background); color: var(--foreground);
  box-shadow: var(--shadow-xs), 0 0 0 1px var(--border);
}
.tile:active { scale: 0.96; }
.tile:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tile .shape-option-preview { width: 16px; height: 16px; }
.tile .shape-option-preview-cell { width: 13px; height: 13px; }
.tile-ramp {
  position: relative;
  width: 26px; height: 26px; flex: 0 0 26px;
  padding: 0;
  border-radius: 9999px;
}
.tile-ramp .ramp-option-preview {
  width: 22px; height: 22px; gap: 0;
  border-radius: 9999px; overflow: hidden;
  outline: 1px solid var(--hairline); outline-offset: -1px;
  background: linear-gradient(135deg, var(--ramp-start) 0 48%, var(--ramp-end) 52% 100%);
}
.tile-ramp .ramp-option-preview span { display: none; }
.tile-ramp[aria-pressed="true"] {
  background: var(--foreground);
  box-shadow: none;
}
.tile-ramp[aria-pressed="true"] .ramp-option-preview {
  outline-color: var(--background);
  outline-offset: -1px;
}
.tile-ramp[aria-pressed="true"]:focus-visible { box-shadow: var(--focus-ring); }
.custom-ramp-option-preview {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  border: 2px dotted var(--muted-foreground);
  border-radius: 9999px;
}
.custom-ramp-option-dot {
  width: 7px; height: 7px;
  border-radius: 9999px;
  outline: 1px solid var(--hairline); outline-offset: -1px;
}
.tile-ramp .status-option-preview {
  background: conic-gradient(var(--s0) 0 25%, var(--s1) 25% 50%, var(--s2) 50% 75%, var(--s3) 75% 100%);
}
.status-ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.status-ctl .nfield { flex: 1 1 0; min-width: 0; }
.status-rest { color: var(--muted-foreground); font-size: 11px; }
.status-chart { display: inline-grid; justify-items: start; gap: 12px; }
.status-key { flex-wrap: wrap; gap: 6px 12px; }
.status-key-item { display: inline-flex; align-items: center; gap: 5px; margin: 0 !important; }
.tile-ramp:hover .custom-ramp-option-preview,
.tile-ramp[aria-pressed="true"] .custom-ramp-option-preview { border-color: var(--foreground); }
.option-tooltip { position: relative; }
.option-tooltip[data-tooltip]::before,
.option-tooltip[data-tooltip]::after {
  position: absolute; z-index: 50;
  pointer-events: none;
  opacity: 0;
  transition-property: opacity, scale;
  transition-duration: 150ms;
  transition-timing-function: var(--ease-emphasis);
}
.option-tooltip[data-tooltip]::after {
  content: attr(data-tooltip);
  left: 50%; bottom: calc(100% + 7px);
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card); color: var(--foreground);
  box-shadow: var(--shadow-border);
  font-size: 10px; font-weight: 500; line-height: 1.1;
  width: max-content; max-width: 180px;
  text-align: center; white-space: normal;
  translate: -50% 3px; scale: .96;
}
.option-tooltip[data-tooltip]::before {
  content: "";
  left: 50%; bottom: calc(100% + 3px);
  width: 8px; height: 8px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: 1px;
  background: var(--card);
  rotate: 45deg;
  translate: -50% 50%;
  scale: .96;
}
.option-tooltip[data-tooltip]:hover::before,
.option-tooltip[data-tooltip]:focus-visible::before { opacity: 1; scale: 1; }
.option-tooltip[data-tooltip]:hover::after,
.option-tooltip[data-tooltip]:focus-visible::after {
  opacity: 1; translate: -50% 0; scale: 1;
}

/* Keep edge tooltips inside the inspector instead of centering them beyond
 * the panel rail. Palette rows are eight swatches wide at this density. */
.cell-segmented > .option-tooltip:first-child[data-tooltip]::after,
.dimension-switch > .option-tooltip:first-child[data-tooltip]::after,
.tabs-compact > .option-tooltip:first-child[data-tooltip]::after,
.tilebox-shape > .option-tooltip:nth-child(8n + 1)[data-tooltip]::after,
.tilebox-ramp > .option-tooltip:nth-child(8n + 1)[data-tooltip]::after {
  left: 0; translate: 0 3px;
}
.cell-segmented > .option-tooltip:first-child[data-tooltip]:hover::after,
.cell-segmented > .option-tooltip:first-child[data-tooltip]:focus-visible::after,
.dimension-switch > .option-tooltip:first-child[data-tooltip]:hover::after,
.dimension-switch > .option-tooltip:first-child[data-tooltip]:focus-visible::after,
.tabs-compact > .option-tooltip:first-child[data-tooltip]:hover::after,
.tabs-compact > .option-tooltip:first-child[data-tooltip]:focus-visible::after,
.tilebox-shape > .option-tooltip:nth-child(8n + 1)[data-tooltip]:hover::after,
.tilebox-shape > .option-tooltip:nth-child(8n + 1)[data-tooltip]:focus-visible::after,
.tilebox-ramp > .option-tooltip:nth-child(8n + 1)[data-tooltip]:hover::after,
.tilebox-ramp > .option-tooltip:nth-child(8n + 1)[data-tooltip]:focus-visible::after {
  translate: 0 0;
}
.cell-segmented > .option-tooltip:last-child[data-tooltip]::after,
.dimension-switch > .option-tooltip:last-child[data-tooltip]::after,
.tabs-compact > .option-tooltip:last-child[data-tooltip]::after,
.tilebox-shape > .option-tooltip:nth-child(8n)[data-tooltip]::after,
.tilebox-shape > .option-tooltip:last-child[data-tooltip]::after,
.tilebox-ramp > .option-tooltip:nth-child(8n)[data-tooltip]::after,
.tilebox-ramp > .option-tooltip:last-child[data-tooltip]::after {
  left: auto; right: 0; translate: 0 3px;
}
.cell-segmented > .option-tooltip:last-child[data-tooltip]:hover::after,
.cell-segmented > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.dimension-switch > .option-tooltip:last-child[data-tooltip]:hover::after,
.dimension-switch > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.tabs-compact > .option-tooltip:last-child[data-tooltip]:hover::after,
.tabs-compact > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.tilebox-shape > .option-tooltip:nth-child(8n)[data-tooltip]:hover::after,
.tilebox-shape > .option-tooltip:nth-child(8n)[data-tooltip]:focus-visible::after,
.tilebox-shape > .option-tooltip:last-child[data-tooltip]:hover::after,
.tilebox-shape > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.tilebox-ramp > .option-tooltip:nth-child(8n)[data-tooltip]:hover::after,
.tilebox-ramp > .option-tooltip:nth-child(8n)[data-tooltip]:focus-visible::after,
.tilebox-ramp > .option-tooltip:last-child[data-tooltip]:hover::after,
.tilebox-ramp > .option-tooltip:last-child[data-tooltip]:focus-visible::after {
  translate: 0 0;
}

/* The 3D block styles join the same trough language. */
.panel-body .material-options {
  gap: 3px; padding: 3px;
  border-radius: var(--radius-md);
  background: color-mix(in oklch, var(--foreground) 6%, transparent);
}
.panel-body .material {
  min-height: 46px; padding: 3px 2px 4px;
  border: 0; border-radius: 5px;
  background: transparent; font-size: 10px;
}
.panel-body .material:hover { background: color-mix(in oklch, var(--foreground) 12%, transparent); color: var(--foreground); }
.panel-body .material[aria-pressed="true"] {
  background: var(--background); color: var(--foreground);
  box-shadow: var(--shadow-xs), 0 0 0 1px var(--border);
}
.panel-body .material svg { width: 26px; height: 26px; }

/* Segmented controls shrink to the row height, staying concentric. */
.panel-body .cell-segmented { height: var(--ctl-h); padding: 2px; border-radius: var(--radius-md); }
.panel-body .cell-segmented button { height: 24px; border-radius: 6px; font-size: 11px; }

.panel-body .hex-input { width: 100%; height: var(--ctl-h); border-radius: var(--radius-sm); font-size: 12px; }
.panel-body .field-note { padding-block: 2px; }

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 32px;
  min-width: 0;
}
.stage::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(
    56% 42% at 62% 0%,
    color-mix(in oklch, var(--foreground) 5%, transparent),
    transparent 70%
  );
}
.stage > * { position: relative; z-index: 1; }

/* --- Brand -------------------------------------------------------------- */
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 26px; height: 26px;
  flex: none;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--primary-foreground);
  box-shadow: var(--shadow-xs);
}
.brand-copy { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.brand-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand-version { margin-top: 3px; color: var(--muted-foreground); font-size: 10px; line-height: 1; }

/* --- Badge -------------------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center;
  flex: none; white-space: nowrap;   /* a dimension must never wrap mid-value */
  height: 20px; padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 9999px;
  background: var(--muted);
  color: var(--muted-foreground);
  font-size: 11px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* --- Field rows (the camera tray) --------------------------------------- */

.field { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field > label { font-size: 11px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; user-select: none; }
.field-label { font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
.field-control { display: flex; align-items: center; gap: 8px; min-width: 0; }
.field-value {
  min-width: 38px; text-align: right;
  font-size: 11px; color: var(--muted-foreground);
  font-variant-numeric: tabular-nums;
}

/* --- Tabs (theme) ------------------------------------------------------- */
.tabs {
  display: inline-flex;
  width: 100%;
  padding: 3px;                       /* concentric: 10 = 7 + 3 */
  gap: 2px;
  border-radius: var(--radius-lg);
  background: var(--muted);
}
.tab {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px;
  padding-inline: 8px 10px;           /* optical: leading icon side -2px */
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted-foreground);
  font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition-property: background-color, color, box-shadow, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.tab:hover { color: var(--foreground); }
.tab:active { scale: 0.96; }
.tab[data-state="active"] {
  background: var(--background);
  color: var(--foreground);
  box-shadow: var(--shadow-xs);
}
.tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tabs-compact {
  position: relative;
  width: 96px;
  min-width: 96px;
  height: 32px;
  margin-inline: auto;
  padding: 0;
  gap: 0;
  border: 0;
  border-radius: 9999px;
  background: var(--background);
  box-shadow: inset 0 0 0 1px var(--border);
  overflow: visible;
}
.tabs-compact .tab {
  position: relative;
  flex: none;
  width: 32px;
  min-width: 32px;
  height: 32px;
  padding: 0;
  gap: 0;
  border-radius: 9999px;
  background: transparent;
  color: var(--muted-foreground);
  transition-property: color;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}
.tabs-compact .tab:hover { color: var(--foreground); }
.tabs-compact .tab:active { scale: 1; }
.tabs-compact .tab[data-state="active"] {
  background: transparent;
  color: var(--foreground);
  box-shadow: none;
}
.tabs-compact .tab > .tabs-compact-active {
  position: absolute;
  inset: 0;
  border: 1px solid var(--border);
  border-radius: 9999px;
  pointer-events: none;
}
.tabs-compact .tab svg { flex: none; width: 16px; height: 16px; }
/* In the panel header the switcher sits beside a 26px brand mark. */
.panel-head .tabs-compact { width: 90px; min-width: 90px; height: 28px; margin-inline: 0; }
.panel-head .tabs-compact .tab { width: 30px; min-width: 30px; height: 28px; }
.panel-head .tabs-compact .tab svg { width: 15px; height: 15px; }
.tabs-compact .tab:focus-visible { box-shadow: var(--focus-ring); }

/* --- Select ------------------------------------------------------------- */
.select-wrap { position: relative; display: flex; width: 158px; }
.select {
  display: inline-flex; align-items: center; justify-content: space-between;
  width: 100%; height: 32px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground);
  font: inherit; font-size: 12px;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.select-value {
  display: inline-flex; align-items: center; gap: 7px;
  min-width: 0;
}
.select-value-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select:hover { border-color: var(--ring); }
.select:focus-visible { outline: none; border-color: var(--ring); box-shadow: var(--focus-ring); }
.select[aria-expanded="true"] { border-color: var(--ring); box-shadow: var(--focus-ring); }
.select-chevron {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; line-height: 0;
  position: absolute; right: 10px; top: 50%;
  translate: 0 -50%;
  pointer-events: none;
  color: var(--muted-foreground);
  transition-property: rotate;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.select-wrap[data-open="true"] .select-chevron { rotate: 180deg; }
.select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
  display: flex; flex-direction: column; gap: 2px;
  width: 100%; max-height: 280px; overflow-y: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--card);
  color: var(--foreground);
  box-shadow: 0 10px 30px -12px oklch(0 0 0 / 0.5);
}
.select-wrap[data-placement="top"] .select-menu {
  top: auto;
  bottom: calc(100% + 4px);
}
.select-option {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; min-height: 32px;
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground);
  font: inherit; font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.select-option-content { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.chart-option-preview {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex: none;
  color: var(--muted-foreground);
}
.select-value .chart-option-preview { color: var(--foreground); }
.shape-option-preview {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; flex: none;
  color: var(--muted-foreground);
}
.shape-option-preview-cell { display: block; width: 16px; height: 16px; }
.ramp-option-preview {
  display: inline-flex; align-items: center; gap: 3px;
  width: 45px; height: 20px; flex: none;
}
.ramp-option-preview span {
  width: 9px; height: 9px; flex: none;
  border-radius: 9999px;
  outline: 1px solid var(--hairline);
  outline-offset: -1px;
}
.select-option[data-selected="true"] .shape-option-preview { color: var(--foreground); }
.select-option:hover,
.select-option[data-highlighted="true"] { background: var(--accent); }
.select-option[data-selected="true"] { font-weight: 500; }
.select-option:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.select-option-check { display: inline-flex; flex: none; color: var(--muted-foreground); }

/* --- Slider ------------------------------------------------------------- */
.slider {
  width: 132px; height: 16px;
  background: transparent;
  cursor: pointer;
  appearance: none;
}
.slider::-webkit-slider-runnable-track {
  height: 6px; border-radius: 9999px;
  background: linear-gradient(
    to right,
    var(--primary) 0 var(--pct, 50%),
    var(--muted) var(--pct, 50%) 100%
  );
}
.slider::-webkit-slider-thumb {
  appearance: none;
  width: 16px; height: 16px;
  margin-top: -5px;                   /* (6 - 16) / 2 */
  border: 1px solid var(--primary);
  border-radius: 9999px;
  background: var(--background);
  box-shadow: var(--shadow-xs);
  transition-property: box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.slider::-moz-range-track { height: 6px; border-radius: 9999px; background: var(--muted); }
.slider::-moz-range-progress { height: 6px; border-radius: 9999px; background: var(--primary); }
.slider::-moz-range-thumb {
  width: 14px; height: 14px;
  border: 1px solid var(--primary);
  border-radius: 9999px;
  background: var(--background);
  box-shadow: var(--shadow-xs);
}
.slider:focus-visible { outline: none; }
.slider:focus-visible::-webkit-slider-thumb { box-shadow: var(--focus-ring); }
.slider:focus-visible::-moz-range-thumb { box-shadow: var(--focus-ring); }

/* --- Switch ------------------------------------------------------------- */
.switch {
  position: relative;
  width: 32px; height: 18px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 9999px;
  background: var(--input);
  cursor: pointer;
  transition-property: background-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.switch[data-state="checked"] { background: var(--primary); }
.switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.switch-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 9999px;
  background: var(--background);
  box-shadow: var(--shadow-xs);
  transition-property: translate;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.switch[data-state="checked"] .switch-thumb { translate: 14px 0; }

/* --- Colour swatch ------------------------------------------------------ */
.swatch {
  display: inline-flex;
  padding: 3px;                       /* concentric: 8 = 5 + 3 */
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: var(--background);
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.swatch:hover { border-color: var(--ring); }
.swatch:focus-within { border-color: var(--ring); box-shadow: var(--focus-ring); }
.swatch input {
  width: 28px; height: 20px;
  padding: 0; border: 0;
  background: none;
  cursor: pointer;
  appearance: none;
}
.swatch input::-webkit-color-swatch-wrapper { padding: 0; }
.swatch input::-webkit-color-swatch {
  border: 0; border-radius: 5px;
  outline: 1px solid var(--hairline);
  outline-offset: -1px;
}
.swatch input::-moz-color-swatch { border: 0; border-radius: 5px; }

/* --- Hex field ---------------------------------------------------------- */
.hex { display: flex; align-items: center; gap: 6px; }
.hex-input {
  width: 96px; height: 32px;
  padding: 0 10px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground);
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  box-shadow: var(--shadow-xs);
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.hex-input:hover { border-color: var(--ring); }
.hex-input:focus-visible { outline: none; border-color: var(--ring); box-shadow: var(--focus-ring); }
.hex-input[aria-invalid="true"] { border-color: var(--destructive); }
.hex-input[aria-invalid="true"]:focus-visible {
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 40%, transparent);
}

/* --- Button ------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px;
  padding-inline: 10px 12px;          /* optical: leading icon side -2px */
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--background);
  color: var(--foreground);
  font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition-property: background-color, color, border-color, box-shadow, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.btn:hover { background: var(--accent); }
.btn:active { scale: 0.96; }
.btn:focus-visible { outline: none; border-color: var(--ring); box-shadow: var(--focus-ring); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-foreground); }
.btn-ghost:hover { background: var(--accent); color: var(--foreground); }

/* --- Icon cross-fade ---------------------------------------------------- */
.icon-swap { position: relative; display: inline-flex; }
.icon-swap > span {
  display: inline-flex;
  transition-property: opacity, filter, scale;
  transition-duration: 300ms;
  transition-timing-function: var(--ease-emphasis);
}
.icon-swap > span.is-overlay { position: absolute; inset: 0; align-items: center; justify-content: center; }
.icon-swap > span[data-on="true"]  { scale: 1; opacity: 1; filter: blur(0px); }
.icon-swap > span[data-on="false"] { scale: 0.25; opacity: 0; filter: blur(4px); }

/* --- Card --------------------------------------------------------------- */
.card {
  display: flex; flex-direction: column; gap: 16px;
  padding: 20px;
  border-radius: var(--radius-xl);
  background: var(--card);
  color: var(--card-foreground);
  box-shadow: var(--shadow-border);
  transition-property: box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.card:hover { box-shadow: var(--shadow-border-hover); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.preview-card { gap: 0; padding: 0; overflow: hidden; }
.preview-tabs {
  display: flex; align-items: stretch; gap: 2px;
  min-height: 46px; padding-inline: 16px;
  background: var(--card);
}
.preview-tab {
  position: relative;
  display: inline-flex; align-items: center;
  height: 46px; padding-inline: 8px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted-foreground);
  font: inherit; font-size: 13px; font-weight: 500;
  line-height: 1; cursor: pointer;
  transition-property: color, background-color;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.preview-tab:hover { color: var(--foreground); }
.preview-tab[aria-selected="true"] { color: var(--foreground); }
.preview-tab[aria-selected="true"]::after {
  content: "";
  position: absolute; inset-inline: 0; bottom: 0;
  height: 2px; border-radius: 9999px;
  background: var(--foreground);
}
.preview-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.preview-surface {
  display: flex; flex-direction: column; gap: 16px;
  margin: 0 4px 4px; padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background); color: var(--foreground);
  overflow: hidden;
}
.code-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.code-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.code-panel-head .card-desc { max-width: 60ch; }
.code-panel .code { overflow: auto; }
.card-title-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-title { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.card-desc { margin: 4px 0 0; font-size: 13px; color: var(--muted-foreground); }
.card-body {
  overflow-x: auto;
  /* overflow-x:auto computes overflow-y to auto too, which would clip the
   * tooltip above the top row and the cell's 1.18 hover scale. The negative
   * margin buys that room back without adding visible space. */
  margin: -44px -6px -6px;
  padding: 44px 6px 6px;
}

/* --- Page header -------------------------------------------------------- */
.page-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.page-desc { margin: 6px 0 0; font-size: 14px; color: var(--muted-foreground); max-width: 60ch; }
.install {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 14px;
  padding: 4px;                       /* concentric: 10 = 6 + 4 */
  border-radius: var(--radius-lg);
  background: var(--muted);
}
.install code {
  padding: 0 8px;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  color: var(--foreground);
}
.install .btn { height: 26px; border-radius: var(--radius-sm); }

/* --- Code block --------------------------------------------------------- */
.code {
  margin: 0;
  padding: 16px;
  border-radius: var(--radius-lg);
  background: var(--muted);
  color: var(--foreground);
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; line-height: 1.7;
  white-space: pre;
  overflow-x: auto;
}

/* --- Staged entrance ---------------------------------------------------- */
.enter {
  opacity: 0;
  transform: translateY(12px);
  filter: blur(4px);
  animation: enter 400ms ease-out forwards;
}
/* The index is passed in, because nth-child would also count the separators
 * between groups and break the even 100ms cadence. */
.enter { animation-delay: calc(var(--enter-index, 0) * 100ms); }
@keyframes enter {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.boot { padding: 32px; color: var(--muted-foreground); }

/* The 3D workbench shares the playground's quiet, neutral chrome. */
.page-heading { display:flex; align-items:center; justify-content:space-between; gap:24px; }
.dimension-switch { display:flex; flex:none; gap:2px; padding:3px; border-radius:10px; background:var(--muted); }
.dimension-switch button { display:flex; align-items:center; justify-content:center; gap:6px; min-width:0; height:30px; padding:0 10px; border:0; border-radius:7px; background:transparent; color:var(--muted-foreground); font:inherit; font-size:12px; font-weight:500; cursor:pointer; }
.dimension-switch button[aria-pressed="true"] { background:var(--card); color:var(--foreground); box-shadow:var(--shadow-border); }
.dimension-switch button:focus-visible, .material:focus-visible, .camera-preset:focus-visible { outline:2px solid var(--ring); outline-offset:3px; }
.three-card { padding-bottom:16px; overflow:hidden; }
.preview-card.three-card { padding: 0; }
.three-card .card-head { align-items:center; }
.three-card .card-body { overflow:visible; margin:0 -16px; padding:0; }
.three-card .heatmap3d { width:100%; }
.three-kicker { display:flex; align-items:center; gap:7px; margin-bottom:8px; font:500 10px "Geist Mono",monospace; color:var(--muted-foreground); letter-spacing:.09em; text-transform:uppercase; }
.three-kicker i { display:block; width:6px; height:6px; border-radius:50%; background:var(--foreground); }
.material-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
.material { display:flex; flex-direction:column; align-items:center; gap:1px; min-height:48px; padding:4px 2px 5px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--muted-foreground); font:inherit; font-size:10px; cursor:pointer; transition-property:background-color,color,border-color; transition-duration:150ms; transition-timing-function:ease-out; }
.material:hover { background:var(--muted); color:var(--foreground); }
.material[aria-pressed="true"] { color:var(--foreground); background:var(--muted); border-color:var(--foreground); }
.material svg { width:30px; height:30px; }
.field-note { margin:0; color:var(--muted-foreground); font-size:11px; line-height:1.6; }
.camera-presets { display:flex; flex-wrap:wrap; gap:5px; }

  return h(PRow,{label,htmlFor:id,end:true},
    h("button",{id,type:"button",className:"switch",role:"switch",
      "aria-checked":on,"aria-label":label,"data-state":on?"checked":"unchecked",
      onClick:()=>set(name,!on)},
      h("span",{className:"switch-thumb"})));
}

/* --- Strip and tray ------------------------------------------------------- */

/**
 * A pill names one part of the chart and reports what it is set to, so the
 * strip answers "what is this chart?" with nothing opened. The dot marks a
 * section holding a value that is not the default.

function Pill({name,value,open,modified,onClick}){

}

/**
 * The tray opens between the strip and the card rather than over it, so the
 * preview is never covered and never moves while a control is being read.
 */
function Tray({label,onClose,children}){
  return h("div",{className:"tray",role:"group","aria-label":label},
    h("button",{type:"button",className:"tray-close",
      "aria-label":"Close "+label.toLowerCase(),onClick:onClose},
      h(Icon,{name:"close",size:13,stroke:2})),

}

function TrayColumn({title,width,grow,children}){
  const style=grow?{flex:"1 1 0%",minWidth:0}:width?{width}:undefined;
  return h("div",{className:"tray-col",style},h("h3",{className:"tray-title"},title),children);

const title=word=>word.charAt(0).toUpperCase()+word.slice(1);

function ShapePreview({shape}){

const GRAPH_ICON_NAMES={
  calendar:"calendar",
  punchcard:"punchcard",

function ChartPreview({graph}){

function paletteFor(name,{dark=false,base="#8b5cf6",levels=4}={}){
  if(name===CUSTOM){
    return deriveRamp(base,{levels,ground:dark?GROUND_DARK:GROUND_LIGHT});
  }
  const preset=RAMPS[name]||RAMPS.green;
  return resampleRamp(preset[dark?"dark":"light"],levels);
}

function RampPreview({ramp,dark,base,levels=4}){
  const colors=paletteFor(ramp,{dark,base,levels});
  return h("span",{className:"ramp-option-preview","aria-hidden":"true",style:{
    "--ramp-start":colors[0],"--ramp-end":colors[colors.length-1]}});
}

function CustomRampPreview({base}){
  return h("span",{className:"custom-ramp-option-preview","aria-hidden":"true"},
    h("span",{className:"custom-ramp-option-dot",style:{background:base}}));
}

function Select({s,set,name,label,options,format,optionPreview}){
  const id="c-"+name;
  const menuId=id+"-menu";
  const wrapRef=useRef(null);
  const triggerRef=useRef(null);
  const itemRefs=useRef([]);
  const selectedIndex=Math.max(0,options.indexOf(s[name]));
  const [open,setOpen]=useState(false);
  const [activeIndex,setActiveIndex]=useState(selectedIndex);
  const [placement,setPlacement]=useState("bottom");
  const display=o=>format?format(o):o;

  // Keep the custom menu dismissible without stealing focus from other controls.
  useEffect(()=>{
    if(!open) setActiveIndex(selectedIndex);
  },[open,selectedIndex]);

  useEffect(()=>{
    if(!open) return;
    const onPointerDown=e=>{
      if(!wrapRef.current?.contains(e.target)) setOpen(false);
    };
    const onFocusIn=e=>{
      if(!wrapRef.current?.contains(e.target)) setOpen(false);
    };
    document.addEventListener("pointerdown",onPointerDown);
    document.addEventListener("focusin",onFocusIn);
    return ()=>{
      document.removeEventListener("pointerdown",onPointerDown);
      document.removeEventListener("focusin",onFocusIn);
    };
  },[open]);

  // Keep a long menu inside the viewport, especially in the sticky sidebar.
  useEffect(()=>{
    if(!open) return;
    const updatePlacement=()=>{
      const rect=wrapRef.current?.getBoundingClientRect();
      if(!rect) return;
      const estimatedHeight=Math.min(280,8+options.length*36);
      const roomBelow=window.innerHeight-rect.bottom;
      const roomAbove=rect.top;
      setPlacement(roomBelow<estimatedHeight&&roomAbove>roomBelow?"top":"bottom");
    };
    updatePlacement();
    window.addEventListener("resize",updatePlacement);
    return ()=>window.removeEventListener("resize",updatePlacement);
  },[open,options.length]);

  // A shadcn-style menu gives keyboard users a focused item, not a browser popup.
  useEffect(()=>{
    if(open) itemRefs.current[activeIndex]?.focus();
  },[open,activeIndex]);

  const close=restoreFocus=>{
    setOpen(false);
    if(restoreFocus) requestAnimationFrame(()=>triggerRef.current?.focus());
  };
  const openMenu=()=>{
    setActiveIndex(selectedIndex);
    setOpen(true);
  };
  const move=delta=>setActiveIndex(i=>(i+delta+options.length)%options.length);
  const choose=option=>{
    set(name,option);
    close(true);
  };
  const onTriggerKeyDown=e=>{
    if(e.key==="Enter"||e.key===" "||e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      openMenu();
    }
  };
  const onMenuKeyDown=e=>{
    switch(e.key){
      case "ArrowDown": e.preventDefault(); move(1); break;
      case "ArrowUp": e.preventDefault(); move(-1); break;
      case "Home": e.preventDefault(); setActiveIndex(0); break;
      case "End": e.preventDefault(); setActiveIndex(options.length-1); break;
      case "Enter":
      case " ": e.preventDefault(); choose(options[activeIndex]); break;
      case "Escape": e.preventDefault(); close(true); break;
      case "Tab": setOpen(false); break;
    }
  };

  return h(PRow,{label,htmlFor:id},
    h("div",{className:"select-wrap",ref:wrapRef,"data-open":open,"data-placement":placement},
      h("button",{id,ref:triggerRef,type:"button",className:"select",
        "aria-haspopup":"menu","aria-expanded":open,"aria-controls":menuId,
        "aria-label":label+": "+display(s[name]),
        onClick:()=>open?close(true):openMenu(),onKeyDown:onTriggerKeyDown},
        h("span",{className:"select-value"},
          optionPreview?optionPreview(s[name]):null,
          h("span",{className:"select-value-label"},display(s[name]))),
        h("span",{className:"select-chevron"},h(Icon,{name:"chevron",size:15,stroke:1.5}))),
      open?h("div",{id:menuId,className:"select-menu",role:"menu","aria-label":label,
        onKeyDown:onMenuKeyDown},
        options.map((o,i)=>{
          const selected=o===s[name];
          return h("button",{key:o,type:"button",className:"select-option",
            role:"menuitemradio","aria-checked":selected,tabIndex:-1,
            "data-selected":selected,"data-highlighted":i===activeIndex,
            ref:el=>{itemRefs.current[i]=el;},
            onClick:()=>choose(o)},
            h("span",{className:"select-option-content"},
              optionPreview?optionPreview(o):null,
              h("span",null,display(o))),
            selected?h("span",{className:"select-option-check","aria-hidden":"true"},h(Icon,{name:"check",size:14,stroke:2})):null);
        })):null));
}

/* --- Properties panel primitives -------------------------------------------
 * Figma's UI3 lesson, applied: give a control a visible affordance, put every
 * row on the same two rails, and let a section fold away when it is not the
 * one being worked on.
 */

/** One inspector row: a fixed label column, then the control column. */
function PRow({label,htmlFor,end,split,children}){
  const labelProps={className:"prow-label"};
  if(htmlFor) labelProps.htmlFor=htmlFor;
  return h("div",{className:"prow"},
    h(htmlFor?"label":"span",labelProps,label),
    h("div",{className:"prow-ctl"+(end?" prow-end":"")+(split?" prow-split":"")},children));
}

/** A control wide enough to need the whole column keeps its label above it. */
function PBlock({label,children}){
  return h("div",{className:"prow prow-wide"},
    h("span",{className:"prow-label"},label),
    children);
}

/**
 * The scrub field. Type an exact value, nudge it with the arrow keys (shift
 * for ten), or drag the grip sideways. A slider could only be dragged, and
 * only as finely as its 132px track allowed — this is a third of the width
 * and settable to the step.
 */
function NumberField({value,min,max,step=1,suffix="",label,id,onChange}){
  const [draft,setDraft]=useState(null);
  const [scrubbing,setScrubbing]=useState(false);
  const drag=useRef(null);

  const clamp=v=>Math.min(max,Math.max(min,Math.round(v/step)*step));
  const commit=raw=>{
    const n=parseFloat(String(raw).replace(/[^0-9.+-]/g,""));
    if(Number.isFinite(n)) onChange(clamp(n));
    setDraft(null);
  };
  const nudge=(dir,big)=>{ setDraft(null); onChange(clamp(value+dir*step*(big?10:1))); };

  /* Four pixels of travel per step keeps a short range steady under the hand;
   * shift multiplies by ten so a 360° range is still one comfortable drag. */
  const onPointerDown=e=>{
    if(e.button!==0) return;
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    drag.current={x:e.clientX,from:value};
    setScrubbing(true);
    document.body.dataset.scrubbing="true";
  };
  const onPointerMove=e=>{
    if(!drag.current) return;
    const steps=Math.round((e.clientX-drag.current.x)/4)*(e.shiftKey?10:1);
    onChange(clamp(drag.current.from+steps*step));
  };
  const onPointerUp=e=>{
    if(!drag.current) return;
    drag.current=null;
    setScrubbing(false);
    delete document.body.dataset.scrubbing;
    if(e.currentTarget.hasPointerCapture?.(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId);
  };

  const onKeyDown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); commit(e.currentTarget.value); }
    else if(e.key==="Escape"){ e.preventDefault(); setDraft(null); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); nudge(1,e.shiftKey); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); nudge(-1,e.shiftKey); }
  };

  return h("div",{className:"nfield","data-scrub":scrubbing?"true":"false"},
    h("span",{className:"nfield-grip","aria-hidden":"true",title:label+" — drag to change",
      onPointerDown,onPointerMove,onPointerUp,onPointerCancel:onPointerUp},
      h(Icon,{name:"scrub",size:13,stroke:1.5})),
    h("input",{id,className:"nfield-input",type:"text",inputMode:"numeric",
      autoComplete:"off",spellCheck:false,"aria-label":label,
      value:draft??String(value),
      onChange:e=>setDraft(e.target.value),
      onBlur:e=>commit(e.target.value),
      onKeyDown}),
    suffix?h("span",{className:"nfield-unit","aria-hidden":"true"},suffix):null);
}

function NumRow({s,set,name,label,min,max,step,suffix}){
  const id="c-"+name;
  return h(PRow,{label,htmlFor:id},
    h(NumberField,{id,label,value:s[name],min,max,step,suffix,onChange:v=>set(name,v)}));
}

/** Two readings of the same thing share a row, the way W and H do. */
function NumPair({s,set,label,a,b}){
  const field=f=>h(NumberField,{key:f.name,id:"c-"+f.name,label:f.label,value:s[f.name],
    min:f.min,max:f.max,suffix:f.suffix,onChange:v=>set(f.name,v)});
  return h("div",{className:"prow"},
    h("span",{className:"prow-label"},label),
    h("div",{className:"prow-ctl prow-split"},field(a),field(b)));
}

/**
 * A section folds, carries a dot when it holds something other than a default,
 * and resets only itself — so undoing one experiment no longer means undoing
 * every other one.
 */
function Section({id,title,open,onToggle,modified,onReset,style,children}){
  return h("section",{className:"psec enter",style,"data-open":open?"true":"false"},
    h("div",{className:"psec-head"},
      h("button",{type:"button",className:"psec-toggle",
        "aria-expanded":open,"aria-controls":id,onClick:onToggle},
        h("span",{className:"psec-caret"},h(Icon,{name:"chevron",size:13,stroke:2})),
        title),
      modified?h("span",{className:"psec-dot",role:"img",
        "aria-label":title+" is not at its default"}):null,
      h("button",{type:"button",className:"psec-action",
        "aria-label":"Reset "+title.toLowerCase(),title:"Reset "+title.toLowerCase(),
        onClick:onReset},
        h(Icon,{name:"reset",size:13,stroke:2}))),
    h("div",{className:"psec-panel"},
      h("div",{className:"psec-clip"},
        h("div",{className:"psec-rows",id},children))));
}

/** A recessed trough of borderless tiles; only the chosen one lifts out. */
function TileGroup({label,kind,options,value,onChange,labelOf,render}){
  return h("div",{className:"tilebox tilebox-"+kind,role:"group","aria-label":label},
    options.map(o=>h("button",{key:o,type:"button",
      className:"tile tile-"+kind+" option-tooltip","aria-label":labelOf(o),title:labelOf(o),
      "data-tooltip":labelOf(o),
      "aria-pressed":value===o,onClick:()=>onChange(o)},
      render(o))));
}

function ShapeChoices({value,onChange}){
  return h(PBlock,{label:"Shape"},
    h(TileGroup,{label:"Shape",kind:"shape",options:SHAPES,value,onChange,
      labelOf:title,render:shape=>h(ShapePreview,{shape})}));

function EncodeChoice({value,onChange}){
  const options=[
    {value:"color",label:"Colour",tip:"Colour encodes the value"},
    {value:"size",label:"Size",tip:"Size encodes the value"},
    {value:"both",label:"Both",tip:"Colour and size encode the value"},

  return h(PRow,{label:"Encode"},

/* Size and gap are one reading of the cell, so they share a row the way W and
 * H do — each field keeps its own glyph, tooltip and accessible name. */
const CELL_METRICS={
  a:{name:"cellSize",label:"Size",min:6,max:30,suffix:"px"},
  b:{name:"gap",label:"Gap",min:0,max:10,suffix:"px"},
};

/* Only the uptime strip reads as thin pills, so only it splits the cell into
 * width and height. Every other preset keeps one square size. */
const UPTIME_CELL_METRICS={
  a:{name:"cellWidth",label:"Width",min:2,max:30,suffix:"px"},
  b:{name:"cellHeight",label:"Height",min:4,max:40,suffix:"px"},
};
const usesCellAxes=s=>s.dimension!=="3d"&&s.graph==="uptime";
const STATUS_KEYS=["colorBy","statusPalette","statusCustom","degradedBelow","partialBelow","outageBelow"];
const cellKeysFor=s=>s.dimension==="3d"
  ? ["shape3d","blockStyle","material","animation","cellSize","gap","maxHeight"]
  : ["shape","encode",...(usesCellAxes(s)?["cellWidth","cellHeight"]:["cellSize"]),"gap"];

function CellControls({s,set,is3d}){
  if(is3d) return [
    h(PBlock,{key:"block",label:"Block"},
      h("div",{className:"material-options",role:"group","aria-label":"Block style"},
        MATERIALS.map(m=>h("button",{key:m.value,type:"button",className:"material",
          title:m.label,"aria-pressed":s.blockStyle===m.value,
          onClick:()=>set("blockStyle",m.value)},
          h(MaterialPreview,{kind:m.value}),m.label)))),
    h(Select,{key:"shape",s,set,name:"shape3d",label:"Shape",options:SHAPES_3D,format:title}),
    h(NumPair,{key:"metrics",s,set,label:"Cell",...CELL_METRICS}),
    h(NumRow,{key:"height",s,set,name:"maxHeight",label:"Height",min:10,max:150}),
    h(Select,{key:"surface",s,set,name:"material",label:"Surface",options:SURFACE_MATERIALS,
      format:k=>k==="pattern"?"Pattern":"Solid"}),
    h(Select,{key:"entrance",s,set,name:"animation",label:"Entrance",options:ANIMATIONS_3D,
      format:k=>k==="grow"?"Grow":"None"}),
  ];

  return [
    h(ShapeChoices,{key:"shape",value:s.shape,onChange:value=>set("shape",value)}),
    ...(usesCellAxes(s)
      ? [h(NumPair,{key:"axes",s,set,label:"Cell",...UPTIME_CELL_METRICS}),
         h(NumRow,{key:"gap",s,set,...CELL_METRICS.b})]
      : [h(NumPair,{key:"metrics",s,set,label:"Cell",...CELL_METRICS})]),
    // Size would follow the hidden scale, so status mode colours only.
    statusMode(s)?null:h(EncodeChoice,{key:"encode",value:s.encode,onChange:value=>set("encode",value)}),
  ];
}

function PaletteChoices({s,set,isDark}){

  return h(PBlock,{label:"Palette"},

function ScaleChoices({value,onChange}){

/* A named 3D theme owns every colour it needs, cells and chrome alike, so the
 * palette, its base, and the empty swatch have nothing left to say. They come
 * back with `color`, which is the theme that defers to them. Bands and scale
 * stay either way: they shape the ramp rather than choose it. */
function ColorByChoice({value,onChange}){

function StatusPalettePreview({colors}){
  return h("span",{className:"ramp-option-preview status-option-preview","aria-hidden":"true",style:{

/* One row per status: its colour, and for all but the healthy one, the uptime a
 * day must fall below to earn it. Editing any colour forks the palette into
 * Custom, starting from what was on screen. */
const THRESHOLD_KEYS=[null,"degradedBelow","partialBelow","outageBelow"];
function StatusControls({s,setS,isDark,empty,set}){
  const colors=statusColorsFor(s,isDark);
  const choose=name=>setS(p=>({...p,statusPalette:name,
    statusCustom:name===CUSTOM&&!p.statusCustom?statusColorsFor(p,isDark):p.statusCustom}));
  const paint=(index,hex)=>setS(p=>{
    const next=[...statusColorsFor(p,isDark)];
    next[index]=hex;
    return {...p,statusPalette:CUSTOM,statusCustom:next};
  });
  // Keep the bands ordered: outage < partial < degraded, with room for each.
  const bounds={
    degradedBelow:[s.partialBelow+0.1,100],
    partialBelow:[s.outageBelow+0.1,s.degradedBelow-0.1],
    outageBelow:[0,s.partialBelow-0.1],
  };
  const labelOf=name=>name===CUSTOM?"Custom":STATUS_PALETTES[name].label;
  return [
    h(PBlock,{key:"palette",label:"Palette"},
      h(TileGroup,{label:"Status palette",kind:"ramp",options:STATUS_PALETTE_NAMES,
        value:s.statusPalette,onChange:choose,labelOf,
        render:name=>h(StatusPalettePreview,{colors:name===CUSTOM
          ?(s.statusCustom??colors)
          :STATUS_PALETTES[name].colors(isDark)})})),
    ...STATUS_LABELS.map((label,index)=>{
      const key=THRESHOLD_KEYS[index];
      const id="c-status-"+index;
      return h(PRow,{key:id,label:index===2?"Partial":index===3?"Outage":label,htmlFor:id},
        h("div",{className:"status-ctl"},
          h("span",{className:"swatch"},
            h("input",{id,type:"color",value:colors[index],"aria-label":label+" colour",
              onChange:e=>paint(index,e.target.value)})),
          key
            ?h(NumberField,{id:"c-"+key,label:label+": uptime below",value:s[key],
              min:bounds[key][0],max:bounds[key][1],step:0.1,suffix:"%",
              onChange:v=>set(key,Math.round(v*10)/10)})
            :h("span",{className:"status-rest"},"otherwise")));
    }),
    h("p",{key:"note",className:"field-note"},
      "A day takes the worst status whose uptime threshold it falls below."),
    h(EmptyRow,{key:"empty",set,empty,label:"No data"}),
  ];
}

function ColourControls({s,set,setS,is3d,isDark,empty}){
  const themed=is3d&&s.theme3d!=="color";
  const colorBy=usesCellAxes(s)
    ?h(ColorByChoice,{key:"by",value:s.colorBy,onChange:v=>set("colorBy",v)}):null;
  if(statusMode(s)) return [colorBy,...StatusControls({s,setS,isDark,empty,set})];
  return [
    colorBy,
    is3d?h(Select,{key:"theme3d",s,set,name:"theme3d",label:"3D theme",options:THEMES_3D,format:title}):null,
    themed?h("p",{key:"themed",className:"field-note"},
      `The ${title(s.theme3d)} theme picks its own colours. Switch to Color to paint the bands yourself.`):null,
    themed?null:h(PaletteChoices,{key:"palette",s,set,isDark}),
    !themed&&s.ramp===CUSTOM?h(PRow,{key:"base",label:"Base",htmlFor:"c-base"},
      h(HexField,{value:s.base,onChange:v=>set("base",v)})):null,
    h(ScaleChoices,{key:"scale",value:s.scale,onChange:value=>set("scale",value)}),
    h(NumRow,{key:"bands",s,set,name:"levels",label:"Bands",min:2,max:8}),
    themed?null:h(EmptyRow,{key:"empty",set,empty,label:"Empty"}),
  ];
}

function LabelControls({s,set,is3d,graph}){
  return [
    ...graph.labels(s,set),
    is3d?null:h(Switch,{key:"values",s,set,name:"showValues",label:"Values in cells"}),
    h(Switch,{key:"legend",s,set,name:"showLegend",label:"Legend"}),
  ];
}

const toHex=({r,g,b})=>"#"+[r,g,b].map(c=>Math.round(c).toString(16).padStart(2,"0")).join("");

/**
 * A preset is a fixed ladder of stops, so a level count it was not written for
 * has to be read off the ladder rather than invented. Walking the existing
 * stops keeps each preset's character at any count, and returns the original
 * array untouched at its natural length — so crossing that point on the slider
 * produces no jump. Channel-wise like the library's own mix, for consistency
 * with a derived ramp.
 */
function resampleRamp(stops,levels){
  if(levels===stops.length) return stops;
  if(levels<=1) return [stops[stops.length-1]];
  const rgb=stops.map(parseHex);
  return Array.from({length:levels},(_,i)=>{
    const position=(i/(levels-1))*(stops.length-1);
    const lower=Math.min(stops.length-2,Math.floor(position));
    const weight=position-lower;
    const from=rgb[lower], to=rgb[lower+1];
    return toHex({
      r:from.r+(to.r-from.r)*weight,
      g:from.g+(to.g-from.g)*weight,
      b:from.b+(to.b-from.b)*weight,
    });
  });
}
/** Everything parseHex accepts: #abc, abc, #AABBCC, any case, stray spaces. */
const normalizeHex=v=>{ const rgb=parseHex(v); return rgb?toHex(rgb):null; };

/**
 * Text and picker over one value. The draft is held separately so a half-typed
 * hex never reaches the grid, and the last valid colour stays on screen.
 */
function HexField({value,onChange}){
  const [draft,setDraft]=useState(value);
  // Re-sync when the value changes from elsewhere: the picker, or Reset.
  useEffect(()=>{setDraft(value);},[value]);
  const valid=parseHex(draft)!==null;
  return h("div",{className:"hex"},
    h("span",{className:"swatch"},
      h("input",{type:"color",value,"aria-label":"Base colour",
        onChange:e=>onChange(e.target.value)})),
    h("input",{className:"hex-input",type:"text",value:draft,spellCheck:false,
      "aria-label":"Base colour hex","aria-invalid":valid?undefined:"true",
      onChange:e=>{
        const next=e.target.value;
        setDraft(next);
        const normalized=normalizeHex(next);
        if(normalized) onChange(normalized);
      },
      // An unparseable draft is abandoned on blur rather than left dangling.
      onBlur:()=>setDraft(value)}));
}

function Tabs({value,options,onChange,label,compact=false}){
  const move=(event,index)=>{
    if(!compact) return;
    const nextIndex=event.key==="Home"?0:event.key==="End"?options.length-1:null;
    const delta=event.key==="ArrowRight"||event.key==="ArrowDown"?1:
      event.key==="ArrowLeft"||event.key==="ArrowUp"?-1:0;
    if(nextIndex===null&&!delta) return;
    event.preventDefault();
    const next=nextIndex===null?(index+delta+options.length)%options.length:nextIndex;
    const group=event.currentTarget.parentElement;
    onChange(options[next].value);
    requestAnimationFrame(()=>group?.children[next]?.focus());
  };
  return h("div",{className:"tabs"+(compact?" tabs-compact":""),role:compact?"radiogroup":"tablist","aria-label":label},
    options.map((o,index)=>{
      const selected=value===o.value;
      return h("button",{key:o.value,type:"button",className:"tab"+(compact?" option-tooltip":""),role:compact?"radio":"tab",
        "aria-selected":compact?undefined:selected,"aria-checked":compact?selected:undefined,
        tabIndex:compact?(selected?0:-1):undefined,
        "data-state":selected?"active":"inactive","data-active":compact?selected:undefined,
        "aria-label":compact?`Switch to ${o.label.toLowerCase()} theme`:undefined,
        "data-tooltip":compact?o.label+" theme":undefined,
        onClick:event=>{if(!selected) onChange(o.value,{animate:event.detail>0});},onKeyDown:event=>move(event,index)},
        h(Icon,{name:o.icon,size:compact?16:14,stroke:2}),
        compact&&selected?h("span",{className:"tabs-compact-active","aria-hidden":"true"}):compact?null:o.label);
    }));
}

/** Both icons stay mounted and cross-fade, so enter and exit both animate. */
function CopyButton({text,label="Copy",className="btn"}){
  const [copied,setCopied]=useState(false);
  const timer=useRef(null);
  useEffect(()=>()=>{ if(timer.current) clearTimeout(timer.current); },[]);
  const copy=async()=>{
    try { await navigator.clipboard.writeText(text); } catch { return; }
    setCopied(true);
    if(timer.current) clearTimeout(timer.current);
    timer.current=setTimeout(()=>setCopied(false),2000);
  };
  return h("button",{type:"button",className,onClick:copy,
    "aria-label":copied?"Copied":label},
    h("span",{className:"icon-swap"},
      h("span",{className:"is-overlay","data-on":String(copied)},h(Icon,{name:"check",stroke:2})),
      h("span",{"data-on":String(!copied)},h(Icon,{name:"copy",stroke:2}))),
    // A label, not only motion, reports the state change.
    copied?"Copied":label);
}

/* --- Code sample ---------------------------------------------------------- */
/** True while a 3D theme other than `color` is deciding the colours itself. */
const themed3d=s=>s.dimension==="3d"&&s.theme3d!=="color";

function snippet(s,empty,ground,colors,stride){
  const recipe = GRAPHS[s.graph].code(s,{stride,dark:ground===GROUND_DARK});
  const { setup=[], lines } = recipe;
  const tag=s.dimension==="3d"?recipe.tag+"3D":recipe.tag;
  const p=[...lines];
  if(s.dimension==="3d"){
    p.push(`  shape="${s.shape3d}"`, `  blockStyle="${s.blockStyle}"`, `  maxHeight={${s.maxHeight}}`);
    p.push(`  yaw={${Math.round(s.yaw*100)/100}}`, `  pitch={${Math.round(s.pitch*100)/100}}`, `  zoom={${Math.round(s.zoom)/100}}`);
    if(s.theme3d!=="color")p.push(`  theme="${s.theme3d}"`);
    if(s.material!=="solid")p.push(`  material="${s.material}"`);
    if(s.animation!=="none")p.push(`  animation="${s.animation}"`);
  } else {
    if(s.shape!=="rounded")p.push(`  shape="${s.shape}"`);
    if(s.encode!=="color"&&!statusMode(s))p.push(`  encode="${s.encode}"`);
  }
  // Status mode paints every known day itself, so the ramp settings are moot.
  const ramped=!themed3d(s)&&!statusMode(s);
  if(s.scale!=="linear"&&!statusMode(s))p.push(`  scale="${s.scale}"`);
  if(usesCellAxes(s)) p.push(`  cellWidth={${s.cellWidth}}`, `  cellHeight={${s.cellHeight}}`);
  else if(s.cellSize!==13)p.push(`  cellSize={${s.cellSize}}`);
  if(s.gap!==3)p.push(`  gap={${s.gap}}`);
  if(s.levels!==4&&!statusMode(s))p.push(`  levels={${s.levels}}`);
  // A named 3D theme colours the cells and the chrome itself. Printing a ramp
  // beside it would only invite a reader to fight it.
  if(ramped){
    if(s.ramp===CUSTOM){
      // deriveRamp defaults ground to white, so it only needs naming on a dark
      // surface. Without it the copied code would not reproduce what is shown.
      const opts=`{ levels: ${s.levels}`+(ground===GROUND_LIGHT?"":`, ground: "${ground}"`)+" }";
      p.push(`  colors={deriveRamp("${s.base}", ${opts})}`);
    }
    // The component's own default is the GitHub preset at its natural light
    // length, so that is the only case where the colours can go unstated.
    else if(s.ramp!=="green"||s.levels!==RAMPS.green.light.length||ground===GROUND_DARK){
      p.push(`  // ${RAMPS[s.ramp].label} palette`);
      p.push(`  colors={${JSON.stringify(colors)}}`);
    }
  }
  if(s.dimension!=="3d"&&s.showValues){
    p.push("  cellContent={(cell) => cell.known && cell.value > 0 ? cell.value : null}");
  }
  // Each renderer has its own default empty colour, so compare against the right one.
  const defaultEmpty=s.dimension==="3d"?EMPTY_3D_DEFAULT:EMPTY_LIGHT;
  if(!themed3d(s)&&empty!==defaultEmpty)p.push(`  emptyColor="${empty}"`);
  if(s.theme!=="system")p.push(`  data-heatmap-theme="${s.theme}"`);
  if(s.showLegend&&!statusMode(s))p.push("  showLegend");

  const named=[tag];
  if(s.ramp===CUSTOM&&!themed3d(s)) named.push("deriveRamp");
  return [
    `import { ${named.join(", ")} } from "@thilakbhat/heatmap-ui";`,
    'import "@thilakbhat/heatmap-ui/styles.css";',
    "",
    ...(setup.length?[...setup,""]:[]),
    `<${tag}`,
    ...p,
    "/>",
  ].join("\n");
}

/** Tracks the OS setting so "system" can resolve to a concrete palette. */
function useSystemDark(){
  const [dark,setDark]=useState(()=>window.matchMedia("(prefers-color-scheme: dark)").matches);
  useEffect(()=>{
    const mql=window.matchMedia("(prefers-color-scheme: dark)");
    const onChange=e=>setDark(e.matches);
    mql.addEventListener("change",onChange);
    return ()=>mql.removeEventListener("change",onChange);
  },[]);
  return dark;
}

/**
 * A theme flip repaints colour, background, border and shadow at once. Every
 * transition on those properties would fire together and smear the switch, so
 * they are suppressed for exactly one frame around the change.
 */
function suppressTransitions(){
  const style=document.createElement("style");
  style.append(document.createTextNode("*,*::before,*::after{transition:none !important}"));
  document.head.append(style);
  // Read for the side effect: forces the new colours to commit while the
  // override still applies, so no transition ever starts.
  void document.body.offsetHeight;
  requestAnimationFrame(()=>requestAnimationFrame(()=>style.remove()));
}

/**
 * Label arrays are declared in full when they are short enough to stay
 * readable, and named with their type when they are not. Truncating a literal
 * would produce code that looks runnable and is not.
 */
function declare(name, items){
  return items.length <= 12
    ? `const ${name} = ${JSON.stringify(items)};`
    : `// ${name}: string[] — ${items.length} entries, e.g. ${JSON.stringify(items.slice(0,3)).slice(1,-1)} …`;
}
function columnLabelDecl(name, entries){
  if (entries.length > 12) return `// ${name}: { column: number; text: string }[] — ${entries.length} entries`;
  const step = entries.length > 1 ? entries[1].column - entries[0].column : 1;
  const offset = entries[0]?.column ?? 0;
  if(offset!==0) return `const ${name} = ${JSON.stringify(entries)};`;
  const index = step === 1 ? "column" : `column: i * ${step}`;
  const args = step === 1 ? "(text, column)" : "(text, i)";
  const body = step === 1 ? "({ column, text })" : `({ ${index}, text })`;
  return `const ${name} = ${JSON.stringify(entries.map(e => e.text))}\n  .map(${args} => ${body});`;
}

 * Each entry owns its data, its labels, the controls that only make sense for

 * scale, colour, legend — is shared across all of them.

const WEEK_START = { Sunday: 0, Monday: 1 };

function WeekStartChoice({value,onChange}){
  return h(PRow,{label:"Week starts"},
    h("div",{className:"cell-segmented week-start-toggle",role:"group","aria-label":"Week starts"},
      Object.keys(WEEK_START).map(option=>h("button",{key:option,type:"button",
        "aria-pressed":value===option,"aria-label":"Start weeks on "+option,
        className:"option-tooltip","data-tooltip":"Start each week on "+option,
        onClick:()=>onChange(option)},option))));
}
